name: E2E Test - Install Script Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  e2e-test-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_BOT_REPO_PREFIX: "test-install-e2e"
      TEST_RUN_ID: "${{ github.run_id }}-${{ github.run_number }}"

    steps:
      # ============================================================
      # 1. Setup
      # ============================================================
      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Authenticate bot
        run: |
          echo "${{ secrets.TEST_BOT_TOKEN }}" | gh auth login --with-token

      - name: Verify bot authentication
        run: |
          echo "🤖 Bot authenticated as:"
          gh auth status

      # ============================================================
      # 2. Create isolated test repository
      # ============================================================
      - name: Create empty test repository
        id: create-repo
        run: |
          TEST_REPO="${{ env.TEST_BOT_REPO_PREFIX }}-${{ env.TEST_RUN_ID }}"
          echo "test_repo=$TEST_REPO" >> $GITHUB_OUTPUT

          echo "📦 Creating empty test repository: $TEST_REPO"

          # Create repo without pushing template files
          gh repo create "$TEST_REPO" \
            --public \
            --disable-wiki \
            --disable-issues \
            2>&1 | grep -E "(created|already exists|https://)" || true

          sleep 2
          echo "✅ Test repo created"

      - name: Initialize test repo
        run: |
          TEST_REPO="${{ steps.create-repo.outputs.test_repo }}"
          TEST_DIR="/tmp/$TEST_REPO"

          echo "🔄 Initializing test repo: $TEST_REPO"
          mkdir -p /tmp

          # Create a minimal git repo
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          git init
          git config user.name "Test Bot"
          git config user.email "test@example.com"

          # Create initial commit
          echo "# Test Repo" > README.md
          git add README.md
          git commit -m "Initial commit"

          # Add remote and push
          git remote add origin "https://github.com/dyvan-bot/$TEST_REPO.git"
          git branch -M main
          git push -u origin main 2>&1 || echo "⚠️  Could not push initial commit"

          echo "test_dir=$TEST_DIR" >> $GITHUB_ENV

      # ============================================================
      # 3. Run install.sh
      # ============================================================
      - name: Test install.sh execution
        id: install-test
        run: |
          cd "${{ env.test_dir }}"

          echo "🚀 Running install.sh from template..."

          # Download install.sh from the main template repo
          INSTALL_SCRIPT_URL="https://raw.githubusercontent.com/dyvan/github-project-llm-management/main/install.sh"

          echo "Downloading from: $INSTALL_SCRIPT_URL"
          curl -fsSL "$INSTALL_SCRIPT_URL" -o install.sh
          chmod +x install.sh

          echo "📝 Running install.sh..."

          # Simulate non-interactive input (multiple empty lines for questions)
          # Questions: use existing repo?, project name?, create repo?
          {
            echo ""  # Use existing repo? (default: n)
            echo ""  # Project name (default)
            echo ""  # Create new repo? (default: n)
          } | bash ./install.sh 2>&1 | tee /tmp/install-output.log

          INSTALL_EXIT=$?
          echo "install_exit=$INSTALL_EXIT" >> $GITHUB_OUTPUT

          if [ $INSTALL_EXIT -eq 0 ]; then
            echo "✅ install.sh executed successfully"
          else
            echo "⚠️  install.sh exited with code: $INSTALL_EXIT (may be expected)"
            echo "Output saved to /tmp/install-output.log"
            # Don't fail here - continue validation
          fi

      # ============================================================
      # 4. Validate repository context
      # ============================================================
      - name: Validate repo context
        id: validate-context
        run: |
          cd "${{ env.test_dir }}"
          TEST_REPO="${{ steps.create-repo.outputs.test_repo }}"

          echo "📍 Checking repository context..."

          # Check repo owner
          REPO_OWNER=$(gh repo view --json owner -q '.owner.login' 2>/dev/null)
          echo "Repository owner: $REPO_OWNER"

          if [ "$REPO_OWNER" = "dyvan-bot" ]; then
            echo "✅ PASS: Repo owner is dyvan-bot (not dyvan)"
            echo "repo_context=pass" >> $GITHUB_OUTPUT
          else
            echo "❌ FAIL: Repo owner is $REPO_OWNER (expected dyvan-bot)"
            echo "repo_context=fail" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 5. Validate project creation
      # ============================================================
      - name: Validate project creation
        id: validate-project
        run: |
          cd "${{ env.test_dir }}"
          TEST_REPO="${{ steps.create-repo.outputs.test_repo }}"

          echo "📋 Checking project creation..."

          # Get repo name
          REPO_NAME=$(gh repo view --json name -q '.name' 2>/dev/null)
          EXPECTED_PROJECT="Project Board : $REPO_NAME"

          echo "Expected project name: $EXPECTED_PROJECT"

          # List projects
          PROJECTS_OUTPUT=$(gh project list --format json 2>/dev/null)

          # Check if project exists
          PROJECT_NUM=$(echo "$PROJECTS_OUTPUT" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              for p in data.get('projects', []):
                  if p.get('title') == '$EXPECTED_PROJECT':
                      print(p.get('number', ''))
                      break
          except:
              pass
          " 2>/dev/null)

          if [ -n "$PROJECT_NUM" ]; then
            echo "✅ PASS: Project found (#$PROJECT_NUM)"
            echo "project_created=pass" >> $GITHUB_OUTPUT
            echo "project_number=$PROJECT_NUM" >> $GITHUB_OUTPUT
          else
            echo "❌ FAIL: Project '$EXPECTED_PROJECT' not found"
            echo "Available projects:"
            gh project list --format json 2>/dev/null | python3 -m json.tool | head -30 || echo "(couldn't list projects)"
            echo "project_created=fail" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 6. Validate custom fields
      # ============================================================
      - name: Validate custom fields
        id: validate-fields
        run: |
          cd "${{ env.test_dir }}"

          echo "🔧 Checking custom fields..."

          PROJECT_NUM="${{ steps.validate-project.outputs.project_number }}"

          if [ -z "$PROJECT_NUM" ]; then
            echo "⚠️  Skipping: Project not found"
            echo "fields_configured=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Try to get fields via gh API
          FIELDS_JSON=$(gh api graphql -f projectNumber:int=$PROJECT_NUM -f owner:string="dyvan-bot" -f query='
            query($owner: String!, $projectNumber: Int!) {
              user(login: $owner) {
                projectV2(number: $projectNumber) {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2Field {
                        name
                      }
                      ... on ProjectV2SingleSelectField {
                        name
                      }
                    }
                  }
                }
              }
            }
          ' 2>/dev/null || echo '{}')

          if echo "$FIELDS_JSON" | grep -q "Status\|Priority\|Effort"; then
            echo "✅ PASS: Custom fields detected"
            echo "fields_configured=pass" >> $GITHUB_OUTPUT
          else
            echo "⚠️  WARN: Could not verify custom fields (may need manual check)"
            echo "fields_configured=warn" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 7. Validate .env file
      # ============================================================
      - name: Validate environment setup
        id: validate-env
        run: |
          cd "${{ env.test_dir }}"

          echo "🔐 Checking .env setup..."

          if [ -f .env ]; then
            echo "✅ PASS: .env file exists"

            # Check if .env is in .gitignore
            if grep -q "^.env$" .gitignore 2>/dev/null; then
              echo "✅ PASS: .env is in .gitignore"
              echo "env_setup=pass" >> $GITHUB_OUTPUT
            else
              echo "❌ FAIL: .env is not in .gitignore"
              echo "env_setup=fail" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ FAIL: .env file not found"
            echo "env_setup=fail" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 8. Generate test report
      # ============================================================
      - name: Generate test report
        id: report
        run: |
          echo "📊 Test Report Generation"
          echo "=========================="

          # Collect results
          REPO_CONTEXT="${{ steps.validate-context.outputs.repo_context }}"
          PROJECT_CREATED="${{ steps.validate-project.outputs.project_created }}"
          FIELDS="${{ steps.validate-fields.outputs.fields_configured }}"
          ENV_SETUP="${{ steps.validate-env.outputs.env_setup }}"

          # Count results
          TOTAL_TESTS=4
          PASSED=0
          FAILED=0
          WARNINGS=0

          declare -a FAILED_TESTS

          # Count each result
          [ "$REPO_CONTEXT" = "pass" ] && ((PASSED++)) || { ((FAILED++)); FAILED_TESTS+=("Repository Context"); }
          [ "$PROJECT_CREATED" = "pass" ] && ((PASSED++)) || { ((FAILED++)); FAILED_TESTS+=("Project Creation"); }
          [ "$ENV_SETUP" = "pass" ] && ((PASSED++)) || { ((FAILED++)); FAILED_TESTS+=("Environment Setup"); }

          # Handle fields (can be warn)
          if [ "$FIELDS" = "pass" ]; then
            ((PASSED++))
          elif [ "$FIELDS" = "warn" ]; then
            ((WARNINGS++))
          else
            ((FAILED++))
            FAILED_TESTS+=("Custom Fields")
          fi

          # Calculate percentage
          if [ $TOTAL_TESTS -gt 0 ]; then
            PERCENTAGE=$((PASSED * 100 / TOTAL_TESTS))
          else
            PERCENTAGE=0
          fi

          # Output report
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Test Results: $PASSED/$TOTAL_TESTS ($PERCENTAGE%)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ $FAILED -eq 0 ] && [ $WARNINGS -eq 0 ]; then
            echo "✅ All tests passed!"
          elif [ $WARNINGS -gt 0 ]; then
            echo "⚠️  Some warnings (may need manual verification)"
          fi

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Failed Tests:"
            for test in "${FAILED_TESTS[@]}"; do
              echo "  - $test"
            done
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Save report to output
          echo "test_percentage=$PERCENTAGE" >> $GITHUB_OUTPUT
          echo "tests_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "tests_total=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "tests_failed=$FAILED" >> $GITHUB_OUTPUT

          # Create failed list
          FAILED_LIST=$(IFS=,; echo "${FAILED_TESTS[*]}")
          echo "failed_tests=$FAILED_LIST" >> $GITHUB_OUTPUT

      # ============================================================
      # 9. Cleanup test repository
      # ============================================================
      - name: Cleanup test repository
        if: always()
        run: |
          TEST_REPO="${{ steps.create-repo.outputs.test_repo }}"

          echo "🧹 Cleaning up test repository: $TEST_REPO"

          # Try to delete the repo
          if gh repo delete "dyvan-bot/$TEST_REPO" --confirm 2>&1; then
            echo "✅ Test repo deleted"
          else
            echo "⚠️  Could not delete test repo (may need manual cleanup)"
            echo "   Run: gh repo delete dyvan-bot/$TEST_REPO"
          fi

      # ============================================================
      # 10. Post summary
      # ============================================================
      - name: Post test summary
        if: always()
        run: |
          cat > /tmp/summary.md << 'EOF'
          ## 🤖 E2E Test: Install Script Validation

          **Test Run:** ${{ env.TEST_RUN_ID }}

          ### 📊 Results

          - **Pass Rate:** ${{ steps.report.outputs.tests_passed }}/${{ steps.report.outputs.tests_total }} (${{ steps.report.outputs.test_percentage }}%)

          ### Detailed Results

          - Repository Context: ${{ steps.validate-context.outputs.repo_context }}
          - Project Creation: ${{ steps.validate-project.outputs.project_created }}
          - Custom Fields: ${{ steps.validate-fields.outputs.fields_configured }}
          - Environment Setup: ${{ steps.validate-env.outputs.env_setup }}

          ### Failed Tests

          ${{ steps.report.outputs.tests_failed > 0 && format('- {0}', steps.report.outputs.failed_tests) || '✅ None' }}

          ### Bot Account

          Test repository created under: `dyvan-bot` (isolated from main account)

          EOF

          cat /tmp/summary.md

      - name: Determine job status
        if: always()
        run: |
          FAILED=${{ steps.report.outputs.tests_failed }}

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ E2E tests failed: $FAILED test(s)"
            exit 1
          else
            echo "✅ E2E tests passed"
            exit 0
          fi
