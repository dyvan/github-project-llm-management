name: Auto-create Branch on Label

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'auto-branch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # Slugify the title (lowercase, replace spaces and special chars with -)
          SLUGIFIED=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-+/-/g' | sed 's/^-|-$//')

          BRANCH_NAME="feat/${ISSUE_NUMBER}-${SLUGIFIED}"

          # Create and push the branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

          echo "Branch created: $BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          REPO=${{ github.repository }}
          BRANCH_NAME=${{ env.BRANCH_NAME }}

          # Create comment body and save to file to avoid YAML escaping issues
          echo "Branch \`$BRANCH_NAME\` has been automatically created." > /tmp/comment.txt
          echo "" >> /tmp/comment.txt
          echo "Next steps:" >> /tmp/comment.txt
          echo "1. Clone and checkout: \`git checkout $BRANCH_NAME\`" >> /tmp/comment.txt
          echo "2. Make your changes" >> /tmp/comment.txt
          echo "3. Push and create a Pull Request" >> /tmp/comment.txt
          echo "4. The Code Review Agent will automatically review your PR" >> /tmp/comment.txt

          gh issue comment $ISSUE_NUMBER --repo "$REPO" --body-file /tmp/comment.txt
