name: Update GitHub Project

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    types: [opened, synchronize, closed]
  issues:
    types: [opened, closed, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  # Projects v2 requires write permission to modify custom fields
  # See: https://docs.github.com/en/graphql/reference/mutations#updateprojectv2itemfieldvalue
  # Note: GITHUB_TOKEN may not have sufficient permissions for Projects v2.
  # If this fails, you may need to use a Personal Access Token with 'project' scope.

jobs:
  update-project:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'issues'

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load project configuration
        id: config
        run: |
          PROJECT_NUM=""

          # Try to load from .env file first (for local development)
          if [ -f .env ]; then
            PROJECT_NUM=$(grep "^GH_PROJECT_NUMBER=" .env | cut -d'=' -f2 | tr -d ' ')
          fi

          # Fallback: Use GitHub Secret if set
          if [ -z "$PROJECT_NUM" ] && [ -n "${{ secrets.GH_PROJECT_NUMBER }}" ]; then
            PROJECT_NUM="${{ secrets.GH_PROJECT_NUMBER }}"
          fi

          # If still empty, detect project dynamically
          if [ -z "$PROJECT_NUM" ]; then
            echo "⚠️  Project number not found in .env or secrets, detecting dynamically..."
            # Will be detected in Python script
            PROJECT_NUM="auto"
          fi

          echo "project_number=${PROJECT_NUM}" >> $GITHUB_OUTPUT
          echo "Loaded project number: ${PROJECT_NUM}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Sync issue to project on creation
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          python scripts/project_sync.py \
            --issue ${{ github.event.issue.number }} \
            --project ${{ steps.config.outputs.project_number }} \
            --status "Backlog"

      - name: Update project on issue labeled
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        run: |
          LABEL="${{ github.event.label.name }}"
          ISSUE_NUM=${{ github.event.issue.number }}

          # Map labels to status changes
          if [[ "$LABEL" == "auto-branch" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --status "Ready"
          elif [[ "$LABEL" == "status:in-progress" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --status "In Progress"
          elif [[ "$LABEL" == "status:blocked" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --status "Blocked"
          fi

          # Map priority labels
          if [[ "$LABEL" == "priority:high" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --priority "High"
          elif [[ "$LABEL" == "priority:medium" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --priority "Medium"
          elif [[ "$LABEL" == "priority:low" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --priority "Low"
          fi

          # Map type labels
          if [[ "$LABEL" == "type:feature" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --type "Feature"
          elif [[ "$LABEL" == "type:bug" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --type "Bug"
          elif [[ "$LABEL" == "type:task" ]]; then
            python scripts/project_sync.py --issue $ISSUE_NUM --project ${{ steps.config.outputs.project_number }} --type "Task"
          fi

      - name: Sync PR to project and update status
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          # Add PR to project with "In Review" status
          python scripts/project_sync.py \
            --pr ${{ github.event.pull_request.number }} \
            --project ${{ steps.config.outputs.project_number }} \
            --status "In Review"

          # Extract and update linked issue
          PR_BODY='${{ github.event.pull_request.body }}'
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oP 'Closes\s+#\K\d+' | head -1)

          if [ -n "$ISSUE_NUM" ]; then
            echo "Found linked issue #$ISSUE_NUM"
            python scripts/project_sync.py \
              --issue $ISSUE_NUM \
              --project ${{ steps.config.outputs.project_number }} \
              --status "In Review"
          else
            echo "No linked issue found in PR description"
          fi

      - name: Update project on PR merge
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
        run: |
          # Update PR status to Done
          python scripts/project_sync.py \
            --pr ${{ github.event.pull_request.number }} \
            --project ${{ steps.config.outputs.project_number }} \
            --status "Done"

          # Extract and update linked issue to Done
          PR_BODY='${{ github.event.pull_request.body }}'
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oP 'Closes\s+#\K\d+' | head -1)

          if [ -n "$ISSUE_NUM" ]; then
            echo "Updating linked issue #$ISSUE_NUM to Done"
            python scripts/project_sync.py \
              --issue $ISSUE_NUM \
              --project ${{ steps.config.outputs.project_number }} \
              --status "Done"
          fi

      - name: Summary
        if: always()
        run: |
          echo "✅ Project synchronization workflow completed"
          echo "GitHub Projects v2 board updated via GraphQL API"
