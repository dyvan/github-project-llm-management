name: CI Tests & Build

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-cov pytest-mock black pylint mypy flake8
          fi

      - name: Verify scripts are executable
        run: |
          test -x setup-project.sh || echo "⚠️ setup-project.sh not executable"
          test -x scripts/project_sync.py || echo "⚠️ project_sync.py not executable"
          echo "✅ Script permissions verified"

      - name: Validate workflow YAML files
        run: |
          pip install pyyaml
          for file in .github/workflows/*.yml; do
            echo "Validating $file..."
            python -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done
          echo "✅ All workflow files are valid YAML"

      - name: Test setup script syntax
        run: |
          bash -n setup-project.sh
          echo "✅ setup-project.sh syntax is valid"

      - name: Format check (black)
        continue-on-error: true
        run: |
          if [ -d "scripts" ]; then
            black --check --line-length 100 scripts/
          fi
          if [ -d "tests" ]; then
            black --check --line-length 100 tests/
          fi
          echo "✅ Code formatting checked"

      - name: Lint Python scripts (pylint)
        continue-on-error: true
        run: |
          if [ -d "scripts" ]; then
            pylint scripts/ --disable=C0111,W0212,R0913,R0914,R0915 --fail-under=7.0 || echo "⚠️ Pylint warnings found"
          fi
          echo "✅ Python linting completed"

      - name: Type check (mypy)
        continue-on-error: true
        run: |
          if [ -d "scripts" ]; then
            mypy scripts/ --ignore-missing-imports || echo "⚠️ Type check warnings found"
          fi
          echo "✅ Type checking completed"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ --cov=scripts/ --cov-report=xml --cov-report=html --cov-report=term --junitxml=test-results.xml
          echo "✅ Tests completed"
        continue-on-error: false

      - name: Run setup script tests
        run: |
          cd tests
          bash test_setup_script.sh
          echo "✅ Setup script tests completed"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Comment test results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read test results
            let comment = '';
            if (fs.existsSync('test-results.xml')) {
              // Parse JUnit XML for basic stats (simplified)
              comment += '## ✅ Tests Passed\n\n';
              comment += '- All unit tests passed\n';
            } else {
              comment += '## ⚠️ Tests Status\n\n';
              comment += '- Check workflow logs for details\n';
            }

            // Read coverage if available
            if (fs.existsSync('htmlcov/status.json')) {
              const coverage = JSON.parse(fs.readFileSync('htmlcov/status.json', 'utf8'));
              comment += `\n**Coverage**: ${coverage.coverage}%\n`;
            }

            comment += '\n---\n*Generated by GitHub Actions*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Set status check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = ${{ job.status == 'success' }};
            const state = success ? 'success' : 'failure';
            const description = success ? 'All checks passed!' : 'Some checks failed';

            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              description: description,
              context: 'ci/tests'
            });

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      - name: Verify project structure
        run: |
          echo "Verifying project structure..."
          errors=0
          for f in scripts/project_sync.py CLAUDE.md README.md; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              errors=$((errors + 1))
            fi
          done
          for d in .github/workflows tests; do
            if [ ! -d "$d" ]; then
              echo "❌ Missing directory: $d"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors file(s) missing"
            exit 1
          fi
          echo "✅ Project structure verified"

      - name: Check documentation exists
        run: |
          echo "Checking documentation..."
          test -f README.md || exit 1
          test -f CONTRIBUTING.md || exit 1
          test -f CODE_OF_CONDUCT.md || exit 1
          test -f LICENSE || exit 1
          test -f ROADMAP.md || exit 1
          test -f PROJECT_BOARD_SETUP.md || exit 1
          echo "✅ Documentation complete"

      - name: Build summary
        run: |
          echo "✅ All checks passed - Template is ready for use"
