name: Feature Request
description: Suggest a new feature
title: "[FEATURE] "
labels: ["type:feature", "status:backlog"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please fill out the sections below to help us understand your request.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature you would like to see implemented
      placeholder: "E.g.: Add a toggle to enable/disable dark mode..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation and use cases
      description: Why is this feature important? What problems does it solve?
      placeholder: "E.g.: Users are requesting an option to reduce eye strain at night..."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: List the criteria to consider this feature complete
      placeholder: |
        - [ ] The UI is implemented and accessible
        - [ ] The API provides the necessary endpoints
        - [ ] Unit tests cover the use cases
        - [ ] Documentation is updated
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have not found a similar feature request
          required: true
        - label: This feature has not already been discussed
          required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, mockups, links, etc.
      placeholder: "Optional"

  - type: dropdown
    id: priority
    attributes:
      label: Estimated Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: false

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort (story points)
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
    validations:
      required: false
