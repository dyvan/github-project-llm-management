name: Task
description: Create an engineering task
title: "[TASK] "
labels: ["type:task", "status:backlog"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template to create an engineering task (refactoring, tech debt, setup, documentation, etc.).

  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Clearly describe what needs to be done
      placeholder: "E.g.: Refactor the authentication module to improve maintainability..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation and objectives
      description: Why is this task necessary? What are the benefits?
      placeholder: |
        - Improve performance of X
        - Reduce technical debt in Y
        - Prepare for feature Z
      render: markdown
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Subtasks (optional)
      description: Break down the task into smaller steps
      placeholder: |
        - [ ] Analyze existing code
        - [ ] Design the solution
        - [ ] Implement changes
        - [ ] Test and validate
        - [ ] Update documentation
      render: markdown
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this task is complete?
      placeholder: |
        - [ ] All tests pass
        - [ ] Documentation is up to date
        - [ ] Code review is approved
      render: markdown
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Does this task depend on other issues or tasks?
      placeholder: |
        - Depends on #123
        - Blocks #456
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort (story points)
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: The task is clearly defined
          required: true
        - label: The acceptance criteria are explicit
          required: true
