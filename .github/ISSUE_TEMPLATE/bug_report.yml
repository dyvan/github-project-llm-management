name: Bug Report
description: Report a bug or issue
title: "[BUG] "
labels: ["type:bug", "status:backlog"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! To help us reproduce and fix it quickly, please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the observed problem
      placeholder: "E.g.: When I click on button X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: List the precise steps to reproduce the bug
      placeholder: |
        1. Go to page X
        2. Click on Y
        3. Observe that Z occurs
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen
      placeholder: "E.g.: The button should display a success notification..."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happens
      placeholder: "E.g.: A 500 error is displayed..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System and environment information
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.11.5
        - Application version: v1.2.3
        - Browser: Chrome 120.0
        - Database: PostgreSQL 15
      render: markdown
    validations:
      required: true

  - type: textarea
    id: error_logs
    attributes:
      label: Logs or error traces
      description: Paste relevant error messages, logs, or stack traces
      placeholder: "Paste logs here..."
      render: bash
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots showing the bug
      placeholder: "Attach images if possible"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have verified that this bug has not already been reported
          required: true
        - label: I can reproduce the bug consistently
          required: true
        - label: The environment information is complete
          required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic)
        - Medium (functional but non-blocking)
        - High (blocks usage)
        - Critical (data loss / security)
    validations:
      required: true
